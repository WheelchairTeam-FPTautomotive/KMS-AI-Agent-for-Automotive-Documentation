[project]
name = "kms-ai-agent-docs"
version = "0.1.0"
description = "KMS AI Agent for Automotive Documentation — RAG Search Engine (Docs-Only)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "openai>=1.14.1",
    "chromadb>=0.4.24",
    "pypdf>=4.1.0",
    "requests>=2.31.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.1.1",
    "ruff>=0.3.3",
    "httpx>=0.27.0",
]
